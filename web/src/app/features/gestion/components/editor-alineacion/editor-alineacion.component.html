<pits-campo-alineacion
  [titulares]="titulares()"
  [interactivo]="true"
  [puestoActivo]="puestoActivo()"
  (puestoPulsado)="pulsarPuesto($event)"
/>
<p class="ayuda" role="status" aria-live="polite">{{ ayuda() }}</p>

@if (puestoActivo()) {
  <div class="candidatos">
    @for (opcion of opciones(); track opcion.jugador.id) {
      <button type="button" class="candidato" (click)="elegir(opcion.jugador)">
        <span class="dorsal">{{ opcion.jugador.dorsal ?? '–' }}</span>
        <span class="nombre">{{ opcion.jugador.nombreMostrar }}</span>
        @if (opcion.situacion) {
          <span class="situacion">{{ opcion.situacion }}</span>
        }
      </button>
    }
    <div class="acciones">
      @if (ocupante()) {
        <button type="button" class="boton" (click)="dejarLibre()">Dejar el puesto libre</button>
      }
      <button type="button" class="boton" (click)="cancelar()">Cancelar</button>
    </div>
  </div>
}
